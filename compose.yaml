services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: beebox
      POSTGRES_PASSWORD: beebox_local
      POSTGRES_DB: beebox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebox -d beebox"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - beebox-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  beebox-postgres:
