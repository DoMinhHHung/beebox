services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: beebox
      POSTGRES_PASSWORD: beebox
      POSTGRES_DB: beebox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebox -d beebox"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - beebox-pg:/var/lib/postgresql/data

  plans:
    build:
      context: .
      dockerfile: beebox-plans/Dockerfile
    environment:
      BEEBOX_HTTP_ADDR: ":8081"
      BEEBOX_DATABASE_URL: postgres://beebox:beebox@postgres:5432/beebox?sslmode=disable
      BEEBOX_INTERNAL_TOKEN: dev-internal
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  projects:
    build:
      context: .
      dockerfile: beebox-projects/Dockerfile
    environment:
      BEEBOX_HTTP_ADDR: ":8082"
      BEEBOX_DATABASE_URL: postgres://beebox:beebox@postgres:5432/beebox?sslmode=disable
      BEEBOX_PLANS_BASE_URL: http://plans:8081
      BEEBOX_INTERNAL_TOKEN: dev-internal
      BEEBOX_OAUTH_KEK: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      plans:
        condition: service_started

  identity:
    build:
      context: .
      dockerfile: beebox-identity/Dockerfile
    environment:
      BEEBOX_HTTP_ADDR: ":8083"
      BEEBOX_DATABASE_URL: postgres://beebox:beebox@postgres:5432/beebox?sslmode=disable
      BEEBOX_PROJECTS_BASE_URL: http://projects:8082
      BEEBOX_INTERNAL_TOKEN: dev-internal
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      projects:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: beebox-gateway/Dockerfile
    environment:
      BEEBOX_HTTP_ADDR: ":8080"
      BEEBOX_PLANS_BASE_URL: http://plans:8081
      BEEBOX_PROJECTS_BASE_URL: http://projects:8082
      BEEBOX_IDENTITY_BASE_URL: http://identity:8083
      BEEBOX_INTERNAL_TOKEN: dev-internal
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      plans:
        condition: service_started
      projects:
        condition: service_started
      identity:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beebox-pg:
