name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Required files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/PRODUCT.md