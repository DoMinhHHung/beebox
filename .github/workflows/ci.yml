name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beebox
          POSTGRES_PASSWORD: beebox_ci
          POSTGRES_DB: beebox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beebox -d beebox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Go version
        run: go version

      - name: Verify formatting
        shell: bash
        run: |
          gofmt -d internal/authentication/social_test.go
          files="$(gofmt -l .)"

          if [ -n "$files" ]; then
            echo "The following files require gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: OpenAPI contract validation
        run: go test ./api/openapi

      - name: Go SDK tests
        run: go test ./sdk/go

      - name: Test
        run: go test ./...

      - name: PostgreSQL integration tests
        env:
          BEEBOX_TEST_DATABASE_URL: postgres://beebox:beebox_ci@127.0.0.1:5432/beebox_test?sslmode=disable
        run: go test -tags=integration ./internal/platform/database ./internal/platform/migration ./internal/platform/maintenance ./internal/applicationinstance/postgres ./internal/identity/postgres ./internal/authentication/postgres ./internal/session/postgres ./internal/httpapi

      - name: Race test
        run: go test -race ./...