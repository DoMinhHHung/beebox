name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beebox
          POSTGRES_PASSWORD: beebox_ci
          POSTGRES_DB: beebox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beebox -d beebox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Go version
        run: go version

      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"

          if [ -n "$files" ]; then
            echo "The following files require gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: PostgreSQL integration tests
        env:
          BEEBOX_TEST_DATABASE_URL: postgres://beebox:beebox_ci@127.0.0.1:5432/beebox_test?sslmode=disable
        run: go test -tags=integration ./internal/platform/database ./internal/platform/migration

      - name: Race test
        run: go test -race ./...
