name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.8"

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Required files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/PRODUCT.md

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/shared
          - beebox-gateway
          - beebox-plans
          - beebox-projects
          - beebox-identity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            */go.mod
            */go.sum
            libs/shared/go.mod
            libs/shared/go.sum
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"
      - name: go mod verify
        working-directory: ${{ matrix.module }}
        run: go mod verify
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beebox
          POSTGRES_PASSWORD: beebox
          POSTGRES_DB: beebox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beebox -d beebox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BEEBOX_DATABASE_URL: postgres://beebox:beebox@127.0.0.1:5432/beebox?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            */go.mod
            */go.sum
            libs/shared/go.mod
            libs/shared/go.sum
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: migrate plans
        run: psql "$BEEBOX_DATABASE_URL" -f beebox-plans/internal/infrastructure/postgres/schema.sql
      - name: migrate projects
        run: psql "$BEEBOX_DATABASE_URL" -f beebox-projects/internal/infrastructure/postgres/schema.sql
      - name: integration plans
        working-directory: beebox-plans
        run: go test -tags=integration -race -count=1 ./...
      - name: integration projects
        working-directory: beebox-projects
        run: go test -tags=integration -race -count=1 ./...
      - name: migrate identity
        run: psql "$BEEBOX_DATABASE_URL" -f beebox-identity/internal/infrastructure/postgres/schema.sql
      - name: integration identity
        working-directory: beebox-identity
        run: go test -tags=integration -race -count=1 ./...
