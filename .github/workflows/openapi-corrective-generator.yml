name: OpenAPI corrective generator

on:
  push:
    branches:
      - refactor/microservices-phase3-baseline

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/microservices-phase3-baseline
          fetch-depth: 0

      - name: Rebuild Gateway edge responses from known-good spec
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          baseline_sha = '462ce59047f06d75062a051f08112227e41d0333'
          baseline = subprocess.check_output(
              ['git', 'show', f'{baseline_sha}:api/openapi/v1.yaml'],
              text=True,
          )
          lines = baseline.splitlines()
          out = []
          current_path = ''
          inserted_operations = 0
          edge_refs = [
              "        '413': {$ref: '#/components/responses/RequestTooLarge'}",
              "        '502': {$ref: '#/components/responses/UpstreamUnavailable'}",
              "        '504': {$ref: '#/components/responses/UpstreamTimeout'}",
          ]
          for line in lines:
              if line.startswith('  /') and line.endswith(':'):
                  current_path = line.strip()[:-1]
              elif line == 'components:':
                  current_path = ''
              out.append(line)
              if current_path.startswith('/v1/') and line == '      responses:':
                  out.extend(edge_refs)
                  inserted_operations += 1
          if inserted_operations != 60:
              raise SystemExit(f'expected 60 /v1 operations, patched {inserted_operations}')
          text = '\n'.join(out) + '\n'

          schemas = '\n'.join([
              '    GatewayRequestTooLargeErrorResponse:',
              '      type: object',
              '      additionalProperties: false',
              '      required: [error]',
              '      properties:',
              '        error:',
              '          type: object',
              '          additionalProperties: false',
              '          required: [code, message, request_id]',
              '          properties:',
              '            code: {type: string, const: request_too_large}',
              '            message: {type: string}',
              "            request_id: {type: string, pattern: '^[0-9a-f]{32}$'}",
              '    GatewayUpstreamUnavailableErrorResponse:',
              '      type: object',
              '      additionalProperties: false',
              '      required: [error]',
              '      properties:',
              '        error:',
              '          type: object',
              '          additionalProperties: false',
              '          required: [code, message, request_id]',
              '          properties:',
              '            code: {type: string, const: upstream_unavailable}',
              '            message: {type: string}',
              "            request_id: {type: string, pattern: '^[0-9a-f]{32}$'}",
              '    GatewayUpstreamTimeoutErrorResponse:',
              '      type: object',
              '      additionalProperties: false',
              '      required: [error]',
              '      properties:',
              '        error:',
              '          type: object',
              '          additionalProperties: false',
              '          required: [code, message, request_id]',
              '          properties:',
              '            code: {type: string, const: upstream_timeout}',
              '            message: {type: string}',
              "            request_id: {type: string, pattern: '^[0-9a-f]{32}$'}",
          ]) + '\n'
          responses = '\n'.join([
              '    RequestTooLarge:',
              '      description: >-',
              '        Gateway rejected the bounded API request before dispatch because its body exceeded the configured limit. The canonical BeeBox error code is request_too_large.',
              '      headers:',
              "        X-Request-ID: {$ref: '#/components/headers/RequestID'}",
              '      content:',
              '        application/json:',
              "          schema: {$ref: '#/components/schemas/GatewayRequestTooLargeErrorResponse'}",
              '    UpstreamUnavailable:',
              '      description: >-',
              '        Gateway could not obtain a response from Identity. Internal hostnames, upstream URLs and network implementation details are never exposed. The canonical BeeBox error code is upstream_unavailable.',
              '      headers:',
              "        X-Request-ID: {$ref: '#/components/headers/RequestID'}",
              '      content:',
              '        application/json:',
              "          schema: {$ref: '#/components/schemas/GatewayUpstreamUnavailableErrorResponse'}",
              '    UpstreamTimeout:',
              '      description: >-',
              '        Gateway did not receive the upstream response before its bounded request timeout. The canonical BeeBox error code is upstream_timeout. For POST, PUT, PATCH or DELETE after dispatch, OUTCOME MAY BE UNKNOWN because Identity may already have committed. Do not blindly replay a non-idempotent mutation; when the operation supports an idempotency key, reuse the same idempotency key, otherwise reconcile authoritative state before deciding whether to retry.',
              '      headers:',
              "        X-Request-ID: {$ref: '#/components/headers/RequestID'}",
              '      content:',
              '        application/json:',
              "          schema: {$ref: '#/components/schemas/GatewayUpstreamTimeoutErrorResponse'}",
          ]) + '\n'

          before_components, components = text.split('\ncomponents:\n', 1)
          if '\n  responses:\n' not in components:
              raise SystemExit('components.responses marker not found')
          components = components.replace('\n  responses:\n', '\n' + schemas + '  responses:\n', 1)
          if '    Accepted:\n' not in components:
              raise SystemExit('components.responses Accepted marker not found')
          components = components.replace('    Accepted:\n', responses + '    Accepted:\n', 1)
          text = before_components + '\ncomponents:\n' + components

          if "security: []\n    GatewayRequest" in text or "security: []\n        GatewayRequest" in text:
              raise SystemExit('Gateway schemas leaked into a path operation')
          if text.count("'413': {$ref: '#/components/responses/RequestTooLarge'}") != 60:
              raise SystemExit('unexpected 413 operation count')
          if text.count("'502': {$ref: '#/components/responses/UpstreamUnavailable'}") != 60:
              raise SystemExit('unexpected 502 operation count')
          if text.count("'504': {$ref: '#/components/responses/UpstreamTimeout'}") != 60:
              raise SystemExit('unexpected 504 operation count')

          Path('api/openapi/v1.yaml').write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/openapi/v1.yaml
          if git diff --cached --quiet; then
            echo "OpenAPI already matches generated edge contract"
            exit 0
          fi
          git commit -m "docs: repair gateway edge responses"
          git push origin HEAD:refactor/microservices-phase3-baseline
