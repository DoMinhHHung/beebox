name: Source snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pack source
        shell: bash
        run: tar --exclude=.git -czf /tmp/beebox-source.tgz .

      - name: Upload source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beebox-source
          path: /tmp/beebox-source.tgz
          if-no-files-found: error
          retention-days: 1
