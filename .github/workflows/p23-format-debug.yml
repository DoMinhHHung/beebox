name: P2.3 format debug

on:
  push:
    branches:
      - feat/phase2-social-oauth

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.x
          check-latest: true
          cache: false
      - name: Show Go 1.26 gofmt diff
        run: gofmt -d internal/authentication/social_test.go
