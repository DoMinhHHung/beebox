openapi: 3.1.0
info:
  title: BeeBox Public API
  version: 1.0.0
  description: >-
    BeeBox-owned B2C authentication contract. Phase 1 email/password behavior,
    P2.1 passwordless email OTP, P2.2 phone-first signup plus verified-phone
    SMS OTP primary authentication, and P2.3 headless social authentication are
    implemented. BeeBox is not an OAuth or OpenID Connect authorization server.
    Public resource identifiers are opaque locators and never establish
    authorization by themselves.
servers:
  - url: /
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      summary: Read Ed25519 access-token verification keys
      security: []
      responses:
        '200':
          description: Active and retiring public verification keys only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JWKS'}
        '404': {description: Access-token capability is not configured.}

  /v1/sign-ups:
    post:
      operationId: signUp
      summary: Start application-scoped email/password signup
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignUpRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ups/phone:
    post:
      operationId: requestPhoneSignUpOTP
      summary: Request an SMS possession challenge for phone-first signup
      description: >-
        Phone input uses strict international E.164 form with no default region or
        national-format guessing. No user is created before successful possession proof.
        For syntactically valid input the response is intentionally generic across a
        new-phone challenge, an already-owned verified phone, resend cooldown/window
        suppression, and account-dependent provider delivery failure. When SMS is
        administratively disabled or incomplete, BeeBox returns service_unavailable
        uniformly before phone ownership or challenge state is inspected.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ups/phone/confirm:
    post:
      operationId: confirmPhoneSignUpOTP
      summary: Prove phone possession and atomically create a phone-first account
      description: >-
        A successful one-time six-digit proof atomically creates one new BeeBox user,
        one verified phone identifier, one ordinary session, refresh verifier state,
        and required audit evidence. Invalid, expired, exhausted, replayed, stale,
        already-owned, or cross-application state is collapsed into invalid_credentials.
        Confirmation is one-time and must not be blindly retried after an ambiguous
        client response; if the commit succeeded, the user can use phone OTP sign-in.
        Browser requests receive refresh state only in the application-specific Secure
        HttpOnly SameSite=Strict __Host- cookie; non-browser callers receive it in JSON.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneConfirmRequest'}
      responses:
        '200':
          description: Ordinary BeeBox session after successful phone possession proof.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/email-verifications:
    post:
      operationId: requestEmailVerification
      summary: Request or resend email ownership verification
      description: Response remains generic when the identifier does not exist, is already verified, or issuance is suppressed.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Confirm email ownership
      description: A successful confirmation proves control of the address only and does not authenticate the user or create a session.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailVerificationConfirmRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKStatus'}
        '400': {$ref: '#/components/responses/VerificationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins:
    post:
      operationId: signIn
      summary: Create a session from verified email/password credentials
      description: >-
        Invalid credentials are anti-enumerating. Browser requests with an allowed
        Origin receive the refresh credential only in an application-specific
        Secure HttpOnly SameSite=Strict __Host- cookie. Non-browser callers receive
        the refresh credential in JSON.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignInRequest'}
      responses:
        '200':
          description: Session and fresh access credential.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins/email-otp:
    post:
      operationId: requestEmailOTPSignIn
      summary: Request a passwordless email OTP primary-authentication challenge
      description: >-
        For syntactically valid email input the response is intentionally generic
        across eligible verified identifiers, unknown or unverified identifiers,
        resend cooldown/window suppression, and account-dependent delivery failure.
        A successful issue creates or rotates a purpose-separated six-digit code;
        no public challenge database identifier is returned.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins/email-otp/confirm:
    post:
      operationId: confirmEmailOTPSignIn
      summary: Create a session from a one-time email OTP primary proof
      description: >-
        Confirmation is one-time and replay-safe. Unknown/unverified identifiers,
        absent, wrong, expired, consumed, attempt-limited, stale/replaced, or
        cross-application challenge state is collapsed into invalid_credentials.
        Browser requests with an allowed Origin receive refresh state only in the
        application-specific Secure HttpOnly SameSite=Strict __Host- cookie;
        non-browser callers receive the refresh credential in JSON. Email OTP is a
        primary authentication method and does not override future required MFA.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailOTPConfirmRequest'}
      responses:
        '200':
          description: Ordinary BeeBox session and fresh access credential after one-time OTP consumption.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins/phone-otp:
    post:
      operationId: requestPhoneOTPSignIn
      summary: Request SMS OTP primary authentication for an existing verified phone
      description: >-
        Phone input uses strict international E.164 form with no default region.
        The response is intentionally generic across eligible verified phones,
        unknown or unverified phones, cooldown/window suppression, and
        account-dependent provider delivery failure. No public challenge identifier
        is returned. When SMS is disabled, service_unavailable is returned uniformly
        before phone ownership or challenge state is inspected.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins/phone-otp/confirm:
    post:
      operationId: confirmPhoneOTPSignIn
      summary: Create a session from a one-time verified-phone SMS OTP primary proof
      description: >-
        Confirmation is one-time and replay-safe. Unknown/unverified phones and
        absent, wrong, expired, consumed, attempt-limited, stale/replaced, or
        cross-application challenge state is collapsed into invalid_credentials.
        Phone OTP is a primary authentication method; it does not bypass future
        additional assurance requirements and is not ranked permanently above or
        below password or email OTP. Browser/non-browser refresh transport is the
        same ordinary BeeBox session transport used by other primary methods.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneConfirmRequest'}
      responses:
        '200':
          description: Ordinary BeeBox session after successful one-time phone OTP consumption.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-auth/attempts:
    post:
      operationId: createSocialAuthAttempt
      summary: Start a browser social authentication attempt
      description: >-
        Resolves the application from X-BeeBox-Publishable-Key, requires an allowed
        browser Origin, requires that Origin to equal the origin of an exact
        application-scoped allowlisted redirect_url, and stores trusted state for ten
        minutes. The caller supplies an RFC 7636 S256 completion code challenge and
        retains the verifier across the provider round-trip. BeeBox requests only the
        provider scope needed to establish a stable provider subject; provider email is
        not account-link authority and is not imported into BeeBox email identifiers.
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SocialAuthAttemptRequest'}
      responses:
        '201':
          description: Provider authorization URL containing BeeBox-bound state.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialAuthAttemptResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-auth/callback/{provider}:
    get:
      operationId: completeSocialProviderCallback
      summary: Receive a configured social provider authorization callback
      description: >-
        The callback trusts only BeeBox state persisted at initiation. The callback
        path, browser state, provider email, and any browser-supplied application or
        redirect input are not account authority. A valid provider proof resolves an
        existing external identity or creates one new provider-first BeeBox principal,
        then redirects only to the exact stored allowlisted redirect. Success carries
        only a short-lived one-time opaque beebox_code. Provider denial after valid
        state carries only beebox_error=social_auth_failed. Provider access, refresh,
        and ID tokens are never redirected to or exposed to the application.
      security: []
      parameters:
        - {$ref: '#/components/parameters/SocialProviderPath'}
      responses:
        '303':
          description: Exact stored application redirect with one bounded BeeBox completion result query parameter.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Location: {schema: {type: string, format: uri}}
        '400':
          description: Invalid or unresolvable BeeBox state. No browser/provider supplied redirect is used.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-auth/exchange:
    post:
      operationId: exchangeSocialAuthCode
      summary: Exchange a one-time social completion grant for an ordinary BeeBox session
      description: >-
        Browser-origin-bound P2.3 exchange. The one-time five-minute completion code is
        useless without the original client PKCE verifier: BeeBox validates S256,
        application scope, expiry, one-time consumption, and current user ownership,
        then atomically creates the same ordinary BeeBox session and refresh state used
        by other primary authentication methods. The operation is not safe for blind
        automatic retry after an ambiguous client response and does not implement MFA,
        account linking, provider-token storage, or profile enrichment.
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SocialAuthExchangeRequest'}
      responses:
        '200':
          description: Ordinary BeeBox session after one-time social completion consumption.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a one-time refresh credential
      description: >-
        Successful refresh consumes the old credential and creates a replacement.
        Reuse of an already consumed refresh credential revokes the session. Clients
        must not blindly retry an ambiguous refresh operation.
      security: [{publishableKey: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Rotated refresh state and fresh five-minute access token.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidRefresh'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Read the current BeeBox session
      description: BeeBox validates the access JWT and current persisted session state, so BeeBox itself observes revocation immediately.
      security:
        - publishableKey: []
          bearerAuth: []
      responses:
        '200':
          description: Current application-scoped session.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sessions/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current session
      description: Public sign-out is idempotent from the client perspective and clears the application-specific refresh cookie when present.
      security:
        - publishableKey: []
          bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/OKStatus'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/backend/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Read one session using backend application authority
      security: [{secretKey: []}]
      parameters:
        - {$ref: '#/components/parameters/SessionID'}
      responses:
        '200':
          description: Session from the application authenticated by the secret key.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/backend/sessions/{session_id}/revoke:
    post:
      operationId: revokeSession
      summary: Revoke one application-scoped session using backend authority
      security: [{secretKey: []}]
      parameters:
        - {$ref: '#/components/parameters/SessionID'}
      responses:
        '200': {$ref: '#/components/responses/OKStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/password-resets:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset
      description: Response is generic for unknown, unverified, ineligible, suppressed, or rate-limited identifiers.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/password-resets/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Replace the password after reset-code verification
      description: >-
        Successful reset replaces the password credential, consumes the challenge,
        revokes all application sessions for the user, and appends its security
        audit fact atomically. Already-issued stateless access JWTs can remain
        cryptographically valid for offline consumers until their short expiry.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetConfirmRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKStatus'}
        '400': {$ref: '#/components/responses/PasswordResetFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: X-BeeBox-Publishable-Key
      description: Non-secret application integration key. It selects application context only and grants no user or backend authority.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Five-minute BeeBox Ed25519 access JWT. Tokens are never accepted in query parameters.
    secretKey:
      type: http
      scheme: bearer
      description: BeeBox backend secret application credential. Plaintext is displayed only once when created and only its verifier is persisted.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
      description: Opaque retry key scoped by server-selected application and operation.
    BrowserOrigin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
      description: Browser origin that must be exactly allowed for the resolved application. Social initiation additionally requires it to equal redirect_url origin.
    SocialProviderPath:
      name: provider
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SocialProvider'}
      description: Fixed BeeBox social provider key. Callback path alone never selects application or ownership authority.
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Opaque session locator; possession is not authorization.

  headers:
    NoStore:
      schema: {type: string, const: no-store}
    RequestID:
      schema: {type: string}

  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email}
    PhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{1,14}$'
          description: Strict international E.164 canonical input. Surrounding ordinary whitespace may be trimmed by BeeBox; there is no default region, national-format guessing, embedded whitespace, punctuation, extension, tel URI prefix, or 00-prefix conversion.
    PhoneConfirmRequest:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{1,14}$'
          description: Strict international E.164 canonical input with no default region or national-format guessing.
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: One-time six-digit SMS possession/authentication code; never returned by BeeBox APIs.
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password:
          type: string
          minLength: 15
          maxLength: 128
          description: 15-128 Unicode code points after NFC normalization. Input is not silently trimmed and no composition rule is imposed.
    EmailVerificationConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: {type: string, format: email}
        code: {type: string, pattern: '^[0-9]{6}$'}
    EmailOTPConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: {type: string, format: email}
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: One-time six-digit passwordless sign-in code; never returned by BeeBox APIs.
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    SocialProvider:
      type: string
      enum: [google, apple, microsoft, github, gitlab, facebook, discord, linkedin, x, tiktok]
      description: Fixed P2.3 provider vocabulary. Provider-specific wire models are not part of the BeeBox public contract.
    SocialAuthAttemptRequest:
      type: object
      additionalProperties: false
      required: [provider, redirect_url, code_challenge, code_challenge_method]
      properties:
        provider: {$ref: '#/components/schemas/SocialProvider'}
        redirect_url:
          type: string
          format: uri
          maxLength: 2048
          description: Exact application-scoped allowlisted redirect. Query strings, fragments, userinfo and wildcards are rejected; production redirects require HTTPS and localhost is the only HTTP development exception.
        code_challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Base64url SHA-256 challenge derived from the caller-retained RFC 7636 verifier.
        code_challenge_method: {type: string, const: S256}
    SocialAuthAttemptResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, expires_in]
      properties:
        authorization_url:
          type: string
          format: uri
          description: Fixed-provider authorization URL carrying BeeBox-generated state and any provider protocol PKCE/nonce material required for proof.
        expires_in: {type: integer, const: 600}
    SocialAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [code, code_verifier]
      properties:
        code:
          type: string
          minLength: 43
          maxLength: 43
          description: One-time 256-bit BeeBox completion grant represented as unpadded base64url. BeeBox stores only its SHA-256 hash.
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
          description: Original RFC 7636 verifier retained by the client and never sent to the social provider.
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 43
          description: One-time opaque refresh credential. The server persists only verifier material.
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, session_id]
      properties:
        access_token:
          type: string
          description: Ed25519/EdDSA JWT with required iss, sub, aud, sid, exp, nbf, iat and jti claims.
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, const: 300}
        session_id:
          type: string
          pattern: '^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        refresh_token:
          type: string
          description: Present only in non-browser mode. Browser mode uses the application-specific __Host- refresh cookie.
    Session:
      type: object
      additionalProperties: false
      required: [id, user_id, created_at, expires_at, revoked]
      properties:
        id:
          type: string
          pattern: '^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        user_id:
          type: string
          pattern: '^usr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked: {type: boolean}
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code, new_password]
      properties:
        email: {type: string, format: email}
        code:
          type: string
          pattern: '^[0-9]{8}$'
        new_password:
          type: string
          minLength: 15
          maxLength: 128
          description: Uses exactly the same NFC, length, safe-byte-bound and blocklist policy as signup.
    JWKS:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: '#/components/schemas/JWK'}
    JWK:
      type: object
      additionalProperties: false
      required: [kty, crv, use, alg, kid, x]
      properties:
        kty: {type: string, const: OKP}
        crv: {type: string, const: Ed25519}
        use: {type: string, const: sig}
        alg: {type: string, const: EdDSA}
        kid: {type: string}
        x: {type: string, description: Unpadded base64url Ed25519 public key material.}

  responses:
    Accepted:
      description: Request accepted without revealing protected account state.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StatusResponse'}
    OKStatus:
      description: Operation completed.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StatusResponse'}
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Application credential is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidCredentials:
      description: Credentials or one-time completion state are invalid without revealing identifier existence, verification, challenge, expiry, replay or ownership state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidRefresh:
      description: Refresh credential is invalid, expired, revoked or replayed. Replay revokes its owning session.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidSession:
      description: Access token or persisted current session state is invalid/revoked.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    SessionNotFound:
      description: Session is absent from the authenticated application scope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    VerificationFailed:
      description: Email verification cannot be completed without exposing protected identifier state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PasswordResetFailed:
      description: Password reset cannot be completed. Challenge/account/replay/expiry details are intentionally collapsed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Origin is not allowed for the resolved application.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Idempotency key conflicts with a different canonical request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidInput:
      description: Input fails deterministic validation, exact redirect policy, provider availability, or public password policy.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Public authentication request limit reached.
      headers:
        Retry-After: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: A required dependency is temporarily unavailable without provider/database details.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
