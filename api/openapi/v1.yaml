openapi: 3.1.0
info:
  title: BeeBox Public API
  version: 1.0.0
  description: BeeBox-owned Phase 1 public authentication contract. BeeBox Phase 1 is not an OAuth or OpenID Connect authorization server.
servers:
  - url: /
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      summary: Read active and retiring access-token verification keys
      security: []
      responses:
        '200':
          description: Public Ed25519 verification keys only. Private signing material is never published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
        '404':
          description: Access-token capability is not configured.
  /v1/sign-ups:
    post:
      operationId: signUp
      summary: Start email/password signup
      security:
        - publishableKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Opaque retry key scoped by server-selected application and signup operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '202':
          description: Signup request accepted without revealing prior identifier existence.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                pending:
                  value:
                    status: verification_pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/email-verifications:
    post:
      operationId: requestEmailVerification
      summary: Request or resend email verification
      security:
        - publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '202':
          description: Accepted generically whether the identifier exists, is verified, or issuance is suppressed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                accepted:
                  value:
                    status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Confirm email ownership with the active verification code
      security:
        - publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
      responses:
        '200':
          description: Email verified.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                verified:
                  value:
                    status: verified
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sign-ins:
    post:
      operationId: signIn
      summary: Create a session with verified email and password credentials
      security:
        - publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Session created. Browser requests with an allowed Origin receive the rotating refresh credential only in a Secure HttpOnly SameSite=Strict __Host- cookie; non-browser requests receive it in the response body.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-ID:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: Present for browser mode; refresh credential is not duplicated in JSON in that mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh credential and issue a new access token
      description: A previously consumed refresh credential is treated as replay and revokes the owning session. Cookie mode requires a non-empty exact stored Origin for the resolved application.
      security:
        - publishableKey: []
      requestBody:
        required: false
        description: Required for non-browser bearer mode. Cookie mode reads the __Host-beebox-refresh cookie instead.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh credential rotated and a new five-minute access token issued.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-ID:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: Updated refresh cookie in browser mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidRefresh'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: X-BeeBox-Publishable-Key
      description: Non-secret application integration key. It selects application context only and grants no user or backend authority.
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    SignUpRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 15
          maxLength: 128
          description: 15-128 Unicode code points after NFC normalization. Input is not trimmed and has no composition-rule requirement.
    SignInRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 43
          description: Opaque 32-byte random refresh credential encoded as unpadded base64url. The server stores only a verifier hash.
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - token_type
        - expires_in
        - session_id
      properties:
        access_token:
          type: string
          description: Ed25519/EdDSA JWT with a five-minute lifetime and mandatory iss, sub, aud, sid, exp, nbf, iat, jti claims.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 300
        session_id:
          type: string
          pattern: '^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        refresh_token:
          type: string
          description: Present only for non-browser mode. Browser mode uses the __Host-beebox-refresh cookie.
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    EmailVerificationConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
    JWKS:
      type: object
      additionalProperties: false
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
    JWK:
      type: object
      additionalProperties: false
      required:
        - kty
        - crv
        - use
        - alg
        - kid
        - x
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: Ed25519
        use:
          type: string
          const: sig
        alg:
          type: string
          const: EdDSA
        kid:
          type: string
        x:
          type: string
          description: Unpadded base64url Ed25519 public key material.
  responses:
    BadRequest:
      description: Invalid request or generic verification failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid application publishable key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: Email/password credentials are invalid without revealing whether the identifier exists or is verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRefresh:
      description: Refresh credential is invalid, expired, revoked, or was replayed. Replay revokes the owning session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Origin is not allowed for the resolved application.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency key conflicts with a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidInput:
      description: Input fails deterministic validation or public password policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Public authentication request limit reached.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Authentication or delivery dependency is temporarily unavailable without provider or database details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
