openapi: 3.1.0
info:
  title: BeeBox Public API
  version: 1.0.0
  description: >-
    BeeBox-owned B2C authentication contract. Phase 1 email/password behavior,
    P2.1 passwordless email OTP, P2.2 phone-first signup plus verified-phone
    SMS OTP primary authentication, P2.3 headless social authentication,
    P2.4A explicit authenticated social account linking, P2.4B linked social
    account listing/unlink, P2.5 passkey/WebAuthn primary authentication, and
    P2.6 TOTP MFA and P2.7 recovery codes are implemented. BeeBox is not an OAuth or OpenID Connect authorization
    server. Public resource identifiers are opaque locators and never establish
    authorization by themselves.
servers:
  - url: /
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      summary: Read Ed25519 access-token verification keys
      security: []
      responses:
        '200':
          description: Active and retiring public verification keys only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JWKS'}
        '404': {description: Access-token capability is not configured.}

  /v1/sign-ups:
    post:
      operationId: signUp
      summary: Start application-scoped email/password signup
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignUpRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ups/phone:
    post:
      operationId: requestPhoneSignUpOTP
      summary: Request an SMS possession challenge for phone-first signup
      description: >-
        Phone input uses strict international E.164 form with no default region or
        national-format guessing. No user is created before successful possession proof.
        For syntactically valid input the response is intentionally generic across a
        new-phone challenge, an already-owned verified phone, resend cooldown/window
        suppression, and account-dependent provider delivery failure. When SMS is
        administratively disabled or incomplete, BeeBox returns service_unavailable
        uniformly before phone ownership or challenge state is inspected.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ups/phone/confirm:
    post:
      operationId: confirmPhoneSignUpOTP
      summary: Prove phone possession and atomically create a phone-first account
      description: >-
        A successful one-time six-digit proof atomically creates one new BeeBox user,
        one verified phone identifier, one ordinary session, refresh verifier state,
        and required audit evidence. Invalid, expired, exhausted, replayed, stale,
        already-owned, or cross-application state is collapsed into invalid_credentials.
        Confirmation is one-time and must not be blindly retried after an ambiguous
        client response; if the commit succeeded, the user can use phone OTP sign-in.
        Browser requests receive refresh state only in the application-specific Secure
        HttpOnly SameSite=Strict __Host- cookie; non-browser callers receive it in JSON.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneConfirmRequest'}
      responses:
        '200':
          description: Ordinary BeeBox session after successful phone possession proof.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/email-verifications:
    post:
      operationId: requestEmailVerification
      summary: Request or resend email ownership verification
      description: Response remains generic when the identifier does not exist, is already verified, or issuance is suppressed.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Confirm email ownership
      description: A successful confirmation proves control of the address only and does not authenticate the user or create a session.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailVerificationConfirmRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKStatus'}
        '400': {$ref: '#/components/responses/VerificationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins:
    post:
      operationId: signIn
      summary: Create a session from verified email/password credentials
      description: >-
        Invalid credentials are anti-enumerating. Browser requests with an allowed
        Origin receive the refresh credential only in an application-specific
        Secure HttpOnly SameSite=Strict __Host- cookie. Non-browser callers receive
        the refresh credential in JSON. Success is a status-discriminated result:
        active TOTP returns only pending-MFA authority, while users without active
        TOTP receive the authenticated session/token result.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignInRequest'}
      responses:
        '200':
          description: Tagged authenticated or MFA-required result after valid password proof.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins/email-otp:
    post:
      operationId: requestEmailOTPSignIn
      summary: Request a passwordless email OTP primary-authentication challenge
      description: >-
        For syntactically valid email input the response is intentionally generic
        across eligible verified identifiers, unknown or unverified identifiers,
        resend cooldown/window suppression, and account-dependent delivery failure.
        A successful issue creates or rotates a purpose-separated six-digit code;
        no public challenge database identifier is returned.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins/email-otp/confirm:
    post:
      operationId: confirmEmailOTPSignIn
      summary: Create a session from a one-time email OTP primary proof
      description: >-
        Confirmation is one-time and replay-safe. Unknown/unverified identifiers,
        absent, wrong, expired, consumed, attempt-limited, stale/replaced, or
        cross-application challenge state is collapsed into invalid_credentials.
        Browser requests with an allowed Origin receive refresh state only in the
        application-specific Secure HttpOnly SameSite=Strict __Host- cookie;
        non-browser callers receive the refresh credential in JSON. Email OTP is a
        primary authentication method. Active TOTP returns the MFA-required result and
        no ordinary session/access/refresh authority is created before MFA completion.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailOTPConfirmRequest'}
      responses:
        '200':
          description: Tagged authenticated or MFA-required result after one-time OTP consumption.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins/phone-otp:
    post:
      operationId: requestPhoneOTPSignIn
      summary: Request SMS OTP primary authentication for an existing verified phone
      description: >-
        Phone input uses strict international E.164 form with no default region.
        The response is intentionally generic across eligible verified phones,
        unknown or unverified phones, cooldown/window suppression, and
        account-dependent provider delivery failure. No public challenge identifier
        is returned. When SMS is disabled, service_unavailable is returned uniformly
        before phone ownership or challenge state is inspected.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sign-ins/phone-otp/confirm:
    post:
      operationId: confirmPhoneOTPSignIn
      summary: Create a session from a one-time verified-phone SMS OTP primary proof
      description: >-
        Confirmation is one-time and replay-safe. Unknown/unverified phones and
        absent, wrong, expired, consumed, attempt-limited, stale/replaced, or
        cross-application challenge state is collapsed into invalid_credentials.
        Phone OTP is a primary authentication method; active TOTP returns the
        MFA-required result without session/access/refresh authority and is not ranked permanently above or
        below password or email OTP. Browser/non-browser refresh transport is the
        same ordinary BeeBox session transport used by other primary methods.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneConfirmRequest'}
      responses:
        '200':
          description: Tagged authenticated or MFA-required result after successful one-time phone OTP consumption.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-auth/attempts:
    post:
      operationId: createSocialAuthAttempt
      summary: Start a browser social authentication attempt
      description: >-
        Resolves the application from X-BeeBox-Publishable-Key, requires an allowed
        browser Origin, requires that Origin to equal the origin of an exact
        application-scoped allowlisted redirect_url, and stores trusted state for ten
        minutes. The caller supplies an RFC 7636 S256 completion code challenge and
        retains the verifier across the provider round-trip. BeeBox requests only the
        provider scope needed to establish a stable provider subject; provider email is
        not account-link authority and is not imported into BeeBox email identifiers.
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SocialAuthAttemptRequest'}
      responses:
        '201':
          description: Provider authorization URL containing BeeBox-bound state.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialAuthAttemptResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-links/attempts:
    post:
      operationId: createSocialLinkAttempt
      summary: Start explicit linking from an existing authenticated BeeBox session
      description: >-
        Requires one publishable key, one exact allowed browser Origin, and one ordinary
        BeeBox bearer access token. BeeBox resolves and persists the exact current
        application, user, and session; the request cannot choose a user or session.
        The initiating persisted session must still be active and its created_at must
        be within the accepted ten-minute recent-authentication window. A fresh access
        token produced by refreshing that same older session does not reset this
        freshness evidence; an older session receives reverification_required and the
        user may authenticate again to obtain a new ordinary session. The provider and
        exact application-scoped allowlisted redirect are bound into one-time
        purpose-separated server state. Provider email/profile data has no ownership
        authority and provider tokens are never returned or retained by this API.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SocialLinkAttemptRequest'}
      responses:
        '201':
          description: Provider authorization URL for the exact initiation-bound social link attempt.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialLinkAttemptResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/SocialLinkUnauthorized'}
        '403': {$ref: '#/components/responses/SocialLinkForbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-links:
    get:
      operationId: listSocialLinks
      summary: List social identities linked to the current BeeBox user
      description: >-
        Requires one publishable key, one exact allowed Origin, and one ordinary
        BeeBox bearer access token whose current persisted session belongs to the exact
        resolved application and user. Listing does not require recent authentication.
        Results are bounded and cursor-paginated in stable created_at plus opaque link-ID
        order. Only the BeeBox-owned social-link ID, provider key, and creation time are
        returned; provider subject, provider email/profile, provider credentials,
        internal database IDs, and unnecessary BeeBox user identifiers are absent.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
        - {$ref: '#/components/parameters/SocialLinkLimit'}
        - {$ref: '#/components/parameters/SocialLinkCursor'}
      responses:
        '200':
          description: Bounded page of linked social identities owned by the current application user.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LinkedSocialAccountPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-links/{social_link_id}:
    delete:
      operationId: unlinkSocialLink
      summary: Unlink one social identity from the current BeeBox user
      description: >-
        Requires the same exact application, Origin, bearer token, and current persisted
        session binding as listing plus server-trusted recent authentication. Freshness
        is derived from persisted session created_at and is accepted only while the
        current time is less than created_at plus ten minutes; refreshing an access
        token for that same older session does not renew freshness and returns
        reverification_required. A syntactically valid link ID that is absent, already
        removed, owned by another user, or belongs to another application returns the
        same idempotent 204 response without revealing ownership. A real unlink is
        rejected with 409 last_authentication_method when no currently usable sign-in or
        recovery path would remain. Password counts only with a verified email; email
        OTP requires configured delivery and a verified email; phone OTP requires
        enabled SMS and a verified phone; remaining social identities count only when
        their provider is configured for the exact application; and an exact-scope
        stored passkey counts as a usable primary authentication method. Existing
        ordinary BeeBox sessions remain active. A successful unlink may conservatively
        invalidate pending unexchanged social completion state and same-provider link
        attempts. BeeBox removes only its ownership association and does not call
        provider-side OAuth consent or token revocation APIs.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
        - {$ref: '#/components/parameters/SocialLinkID'}
      responses:
        '204':
          description: Link removed, already absent, not owned by the current user, or outside the current application scope; response is intentionally anti-enumerating and has no body.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/SocialAccountForbidden'}
        '409': {$ref: '#/components/responses/LastAuthenticationMethod'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-auth/callback/{provider}:
    get:
      operationId: completeSocialProviderCallback
      summary: Receive a configured social provider authorization callback
      description: >-
        Shared callback for BeeBox-issued P2.3 social-auth and P2.4A social-link state.
        Purpose is resolved from server-issued state and dedicated persisted attempt
        state; a prefix alone is never account authority. For P2.3, a valid provider
        proof may resolve an existing external identity or create one provider-first
        BeeBox principal and a one-time completion grant. For P2.4A, the callback can
        only attach an unowned provider subject to the exact application, user, and
        initiating session bound at link initiation; it never creates a principal,
        BeeBox session, or social-auth completion grant, never merges accounts, and
        never imports provider email/profile data. The callback-time browser session,
        callback query user/session/application/redirect values, and provider email are
        not linking authority. Provider access, refresh, and ID tokens are never
        redirected to or exposed to the application. Valid link success redirects only
        to the stored redirect with beebox_link=success; resolved link failures collapse
        to beebox_error=social_link_failed. Unknown state never enables an untrusted
        redirect.
      security: []
      parameters:
        - {$ref: '#/components/parameters/SocialProviderPath'}
      responses:
        '303':
          description: Exact stored application redirect with one bounded BeeBox authentication or linking result query parameter.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Location: {schema: {type: string, format: uri}}
        '400':
          description: Invalid or unresolvable BeeBox state. No browser/provider supplied redirect is used.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/social-auth/exchange:
    post:
      operationId: exchangeSocialAuthCode
      summary: Exchange a one-time social completion grant for an ordinary BeeBox session
      description: >-
        Browser-origin-bound P2.3 exchange. The one-time five-minute completion code is
        useless without the original client PKCE verifier: BeeBox validates S256,
        application scope, expiry, one-time consumption, and current user ownership,
        then atomically chooses the tagged authenticated result or a five-minute
        pending-MFA result when the user has active TOTP. The operation is not safe for
        blind automatic retry after an ambiguous client response and does not perform
        account linking, provider-token storage, or profile enrichment.
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SocialAuthExchangeRequest'}
      responses:
        '200':
          description: Tagged authenticated or MFA-required result after one-time social completion consumption.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/totp/enrollments:
    post:
      operationId: startTOTPEnrollment
      summary: Start one TOTP enrollment for the current user
      description: >-
        Requires the exact current application, user and persisted session plus accepted
        recent reverification. BeeBox generates a SHA-1, six-digit, 30-second TOTP secret,
        returns its Base32 setup value and otpauth URI exactly once, and persists only an
        AES-256-GCM envelope bound to purpose, application, user and credential. The
        enrollment expires within ten minutes and cannot replace an active credential.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      responses:
        '201':
          description: One-time TOTP setup material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPEnrollment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/TOTPForbidden'}
        '409': {$ref: '#/components/responses/TOTPConflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/totp/enrollments/confirm:
    post:
      operationId: confirmTOTPEnrollment
      summary: Confirm and atomically activate TOTP
      description: >-
        Verifies the one-time enrollment under the previous/current/next 30-second
        timestep window, records the accepted timestep, consumes enrollment state and
        appends required audit evidence atomically. The Base32 secret is never returned
        again, logged, audited or emitted as a metric label.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPEnrollmentConfirmRequest'}
      responses:
        '200':
          description: Active TOTP credential metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPCredential'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidTOTPProof'}
        '403': {$ref: '#/components/responses/TOTPForbidden'}
        '409': {$ref: '#/components/responses/TOTPConflict'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/totp:
    get:
      operationId: getTOTPState
      summary: Read minimized current-user TOTP state
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      responses:
        '200':
          description: Whether TOTP is active plus its opaque BeeBox credential ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPState'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: removeTOTP
      summary: Remove the current user's active TOTP credential
      description: >-
        Requires the exact current application, user and persisted session plus accepted
        recent reverification. Removal is atomic with audit evidence and is denied when
        it would strand the user without a usable primary authentication method.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      responses:
        '204': {description: TOTP removed or already absent in the exact current scope.}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/TOTPForbidden'}
        '409': {$ref: '#/components/responses/LastAuthenticationMethod'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/totp/complete:
    post:
      operationId: completeTOTPAuthentication
      summary: Complete pending primary authentication with TOTP
      description: >-
        Accepts the opaque pending-MFA token only in the POST body. The token is five-minute,
        application/user/primary-proof bound, hash-only at rest, limited to five failed
        proofs and consumed atomically on success. The previous/current/next timestep is
        accepted, but one accepted timestep may authorize at most once. No session, access
        token or refresh token exists before this operation commits successfully.
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPAuthenticationCompleteRequest'}
      responses:
        '200':
          description: Tagged authenticated result after successful one-time TOTP completion.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidTOTPProof'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/totp/replacements:
    post:
      operationId: startTOTPReplacement
      summary: Start dedicated TOTP replacement recovery
      description: >-
        Requires the exact current application/user/session, a current primary-proof
        session inside the accepted reverification boundary, and one unused recovery
        code from the active set. The recovery code is consumed only by this dedicated
        replacement operation. The old TOTP credential and remaining recovery set stay
        active until the replacement credential is confirmed atomically.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPReplacementRequest'}
      responses:
        '201':
          description: One-time replacement TOTP setup material; the old credential remains active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPEnrollment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidRecoveryProof'}
        '403': {$ref: '#/components/responses/TOTPForbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/totp/replacements/confirm:
    post:
      operationId: confirmTOTPReplacement
      summary: Confirm dedicated TOTP replacement recovery
      description: >-
        Validates the replacement TOTP proof, then atomically replaces the old
        credential, invalidates the previous recovery set, creates exactly ten new
        recovery codes and appends audit evidence. A failed or abandoned confirmation
        leaves the old TOTP credential active.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPEnrollmentConfirmRequest'}
      responses:
        '200':
          description: Replacement credential metadata and the new recovery set shown exactly once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPCredential'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidTOTPProof'}
        '403': {$ref: '#/components/responses/TOTPForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/recovery-codes:
    get:
      operationId: getRecoveryCodeState
      summary: Read minimized recovery-code availability
      description: Returns only availability and the number of unused codes; no code is ever returned again.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      responses:
        '200':
          description: Minimized recovery-code state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodeState'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/recovery-codes/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      summary: Atomically replace the current recovery set
      description: >-
        Requires exact current application/user/session reverification. Successful
        regeneration atomically invalidates every prior unused code and returns exactly
        ten independent 26-symbol Crockford Base32 codes once. At most three successful
        regenerations are admitted per user/session per hour.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      responses:
        '200':
          description: New recovery codes shown exactly once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodeSet'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/RecoveryForbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/mfa/recovery-codes/complete:
    post:
      operationId: completeRecoveryCodeAuthentication
      summary: Complete pending MFA with one recovery code
      description: >-
        Accepts the pending-MFA token and recovery code only in the POST body. One code
        can complete one pending authentication once under concurrency. Successful use
        consumes the code and pending token atomically but does not disable, remove or
        otherwise alter TOTP and cannot create a generic reverification grant.
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryCodeCompleteRequest'}
      responses:
        '200':
          description: Tagged authenticated result after one-time recovery-code consumption.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidRecoveryProof'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/passkeys/registration/attempts:
    post:
      operationId: beginPasskeyRegistration
      summary: Start a passkey registration ceremony for the current user
      description: >-
        Requires the exact current application, allowed Origin, ordinary BeeBox bearer
        session, and server-trusted recent authentication. Recent authentication is
        required for passkey registration and removal. BeeBox creates a one-time ceremony
        bound to the exact application, user, session, Origin, RP ID and registration
        purpose. The passkey private key remains authenticator-owned and is never sent to
        BeeBox. WebAuthn request and response payloads are opaque JSON at the BeeBox
        contract boundary.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      responses:
        '201':
          description: Opaque WebAuthn creation options and one-time BeeBox ceremony locator.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyAttempt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/PasskeyForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/passkeys/registration/complete:
    post:
      operationId: completePasskeyRegistration
      summary: Complete a one-time passkey registration ceremony
      description: >-
        Consumes the exact application/user/session/Origin-bound registration ceremony,
        verifies the browser WebAuthn response using the trusted stored RP/origin state,
        and atomically persists the BeeBox-owned passkey resource plus required audit.
        Expired, replayed, wrong-application, wrong-Origin, wrong-RP, wrong-challenge,
        malformed, duplicate, wrong-user-handle or otherwise invalid proof fails closed.
        Completion is a one-time security mutation and must not be automatically retried
        after an ambiguous client response.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyRegistrationCompleteRequest'}
      responses:
        '201':
          description: Registered passkey metadata only; no private key or verifier state is exposed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Passkey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidPasskeyProof'}
        '403': {$ref: '#/components/responses/PasskeyForbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/passkeys/authentication/attempts:
    post:
      operationId: beginPasskeyAuthentication
      summary: Start discoverable passkey primary authentication
      description: >-
        Resolves the exact application from the publishable key and requires one exact
        allowed Origin. BeeBox derives the RP ID from that trusted Origin and issues a
        short-lived one-time authentication ceremony requiring WebAuthn user verification.
        Passkey is a primary authentication method and does not bypass configured TOTP;
        active TOTP makes the verified passkey proof enter the same pending-MFA path.
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      responses:
        '201':
          description: Opaque WebAuthn assertion options and one-time BeeBox ceremony locator.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyAttempt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/passkeys/authentication/complete:
    post:
      operationId: completePasskeyAuthentication
      summary: Complete passkey primary authentication and issue an ordinary session
      description: >-
        Consumes one exact application/Origin/RP-bound one-time ceremony, verifies the
        authenticator response and required user verification, resolves credential owner
        only inside that application and RP scope, updates verifier-owned credential state,
        atomically chooses either pending TOTP assurance or the ordinary BeeBox
        session/refresh verifier and appends required audit coherently. Replay, expiry,
        cross-application substitution, wrong owner, wrong
        challenge, wrong Origin/RP or malformed authenticator responses fail closed.
      security: [{publishableKey: []}]
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyAuthenticationCompleteRequest'}
      responses:
        '200':
          description: Tagged authenticated or MFA-required result after valid passkey primary proof.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidPasskeyProof'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/passkeys:
    get:
      operationId: listPasskeys
      summary: List passkeys owned by the current application user
      description: >-
        Requires exact application, allowed Origin and current user/session authority.
        The bounded response exposes only opaque pky_ resource ID, optional bounded name
        and creation time. Credential IDs, public-key material, counters, internal IDs,
        user handles and verifier state are not exposed.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
      responses:
        '200':
          description: Bounded passkey list for the current application/user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyList'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/passkeys/{passkey_id}:
    delete:
      operationId: removePasskey
      summary: Remove one owned passkey
      description: >-
        Requires exact current application/user/session ownership and recent authentication.
        A pky_ locator never grants authority. Removal is rejected with
        last_authentication_method when no other usable authentication path would remain;
        an exact-scope remaining passkey may count as a primary method. Removal plus audit
        is atomic. P2.5 does not classify a passkey as an MFA factor and does not bypass
        configured MFA.
      security:
        - publishableKey: []
          bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/BrowserOrigin'}
        - {$ref: '#/components/parameters/PasskeyID'}
      responses:
        '204':
          description: Owned passkey removed; a valid but absent/out-of-scope locator remains non-authoritative.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '403': {$ref: '#/components/responses/PasskeyForbidden'}
        '409': {$ref: '#/components/responses/LastAuthenticationMethod'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a one-time refresh credential
      description: >-
        Successful refresh consumes the old credential and creates a replacement.
        Reuse of an already consumed refresh credential revokes the session. Clients
        must not blindly retry an ambiguous refresh operation.
      security: [{publishableKey: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Rotated refresh state and fresh five-minute access token.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/InvalidRefresh'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Read the current BeeBox session
      description: BeeBox validates the access JWT and current persisted session state, so BeeBox itself observes revocation immediately.
      security:
        - publishableKey: []
          bearerAuth: []
      responses:
        '200':
          description: Current application-scoped session.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/sessions/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current session
      description: Public sign-out is idempotent from the client perspective and clears the application-specific refresh cookie when present.
      security:
        - publishableKey: []
          bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/OKStatus'}
        '401': {$ref: '#/components/responses/InvalidSession'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/backend/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Read one session using backend application authority
      security: [{secretKey: []}]
      parameters:
        - {$ref: '#/components/parameters/SessionID'}
      responses:
        '200':
          description: Session from the application authenticated by the secret key.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-Request-ID: {$ref: '#/components/headers/RequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/backend/sessions/{session_id}/revoke:
    post:
      operationId: revokeSession
      summary: Revoke one application-scoped session using backend authority
      security: [{secretKey: []}]
      parameters:
        - {$ref: '#/components/parameters/SessionID'}
      responses:
        '200': {$ref: '#/components/responses/OKStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/SessionNotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/password-resets:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset
      description: Response is generic for unknown, unverified, ineligible, suppressed, or rate-limited identifiers.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v1/password-resets/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Replace the password after reset-code verification
      description: >-
        Successful reset replaces the password credential, consumes the challenge,
        revokes all application sessions for the user, and appends its security
        audit fact atomically. Already-issued stateless access JWTs can remain
        cryptographically valid for offline consumers until their short expiry.
      security: [{publishableKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetConfirmRequest'}
      responses:
        '200': {$ref: '#/components/responses/OKStatus'}
        '400': {$ref: '#/components/responses/PasswordResetFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    publishableKey:
      type: apiKey
      in: header
      name: X-BeeBox-Publishable-Key
      description: Non-secret application integration key. It selects application context only and grants no user or backend authority.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Five-minute BeeBox Ed25519 access JWT. Tokens are never accepted in query parameters.
    secretKey:
      type: http
      scheme: bearer
      description: BeeBox backend secret application credential. Plaintext is displayed only once when created and only its verifier is persisted.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
      description: Opaque retry key scoped by server-selected application and operation.
    BrowserOrigin:
      name: Origin
      in: header
      required: true
      schema: {type: string, format: uri}
      description: Browser origin that must be exactly allowed for the resolved application. Social authentication and social-link initiation additionally require it to equal redirect_url origin.
    SocialProviderPath:
      name: provider
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SocialProvider'}
      description: Fixed BeeBox social provider key. Callback path alone never selects application or ownership authority.
    SocialLinkID:
      name: social_link_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^sli_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Opaque BeeBox social-link locator; possession is never authorization and ownership is resolved only from the current application/user session.
    SocialLinkLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: Maximum number of linked social identities returned in one bounded page.
    SocialLinkCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 512}
      description: Opaque pagination state for stable created_at plus public-ID ordering; it conveys no authority.
    PasskeyID:
      name: passkey_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^pky_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Opaque BeeBox passkey resource locator; possession is never authorization.
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Opaque session locator; possession is not authorization.

  headers:
    NoStore:
      schema: {type: string, const: no-store}
    RequestID:
      schema: {type: string}

  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email}
    PhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{1,14}$'
          description: Strict international E.164 canonical input. Surrounding ordinary whitespace may be trimmed by BeeBox; there is no default region, national-format guessing, embedded whitespace, punctuation, extension, tel URI prefix, or 00-prefix conversion.
    PhoneConfirmRequest:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{1,14}$'
          description: Strict international E.164 canonical input with no default region or national-format guessing.
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: One-time six-digit SMS possession/authentication code; never returned by BeeBox APIs.
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password:
          type: string
          minLength: 15
          maxLength: 128
          description: 15-128 Unicode code points after NFC normalization. Input is not silently trimmed and no composition rule is imposed.
    EmailVerificationConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: {type: string, format: email}
        code: {type: string, pattern: '^[0-9]{6}$'}
    EmailOTPConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: {type: string, format: email}
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: One-time six-digit passwordless sign-in code; never returned by BeeBox APIs.
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    SocialProvider:
      type: string
      enum: [google, apple, microsoft, github, gitlab, facebook, slack, discord, linkedin, x, tiktok]
      description: Fixed P2.3/P2.4A/P2.4B provider vocabulary. Provider-specific wire models are not part of the BeeBox public contract.
    SocialAuthAttemptRequest:
      type: object
      additionalProperties: false
      required: [provider, redirect_url, code_challenge, code_challenge_method]
      properties:
        provider: {$ref: '#/components/schemas/SocialProvider'}
        redirect_url:
          type: string
          format: uri
          maxLength: 2048
          description: Exact application-scoped allowlisted redirect. Query strings, fragments, userinfo and wildcards are rejected; production redirects require HTTPS and localhost is the only HTTP development exception.
        code_challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Base64url SHA-256 challenge derived from the caller-retained RFC 7636 verifier.
        code_challenge_method: {type: string, const: S256}
    SocialAuthAttemptResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, expires_in]
      properties:
        authorization_url:
          type: string
          format: uri
          description: Fixed-provider authorization URL carrying BeeBox-generated state and any provider protocol PKCE/nonce material required for proof.
        expires_in: {type: integer, const: 600}
    SocialLinkAttemptRequest:
      type: object
      additionalProperties: false
      required: [provider, redirect_url]
      properties:
        provider: {$ref: '#/components/schemas/SocialProvider'}
        redirect_url:
          type: string
          format: uri
          maxLength: 2048
          description: Exact application-scoped allowlisted redirect. It is trusted server-side state after initiation and cannot be replaced by callback query input.
    SocialLinkAttemptResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, expires_in]
      properties:
        authorization_url:
          type: string
          format: uri
          description: Provider authorization URL carrying purpose-separated BeeBox state plus provider protocol nonce/PKCE material when required.
        expires_in:
          type: integer
          minimum: 1
          maximum: 600
          description: Actual bounded lifetime in seconds, capped by both the link-attempt TTL and the initiating session recent-authentication deadline.
    LinkedSocialAccount:
      type: object
      additionalProperties: false
      required: [id, provider, created_at]
      properties:
        id:
          type: string
          pattern: '^sli_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Opaque BeeBox-owned social-link public resource ID.
        provider: {$ref: '#/components/schemas/SocialProvider'}
        created_at: {type: string, format: date-time}
    LinkedSocialAccountPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/LinkedSocialAccount'}
        next_cursor:
          type: string
          maxLength: 512
          description: Opaque pagination state; omitted when no later page exists.
    SocialAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [code, code_verifier]
      properties:
        code:
          type: string
          minLength: 43
          maxLength: 43
          description: One-time 256-bit BeeBox completion grant represented as unpadded base64url. BeeBox stores only its SHA-256 hash.
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
          description: Original RFC 7636 verifier retained by the client and never sent to the social provider.
    TOTPEnrollment:
      type: object
      additionalProperties: false
      required: [enrollment_id, secret, otpauth_uri, expires_in]
      properties:
        enrollment_id:
          type: string
          pattern: '^mfe_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          writeOnly: true
          description: One-time Base32 setup secret. BeeBox never returns it after enrollment starts.
        otpauth_uri:
          type: string
          format: uri
          writeOnly: true
          description: One-time repository-owned TOTP provisioning URI containing the setup secret.
        expires_in: {type: integer, minimum: 1, maximum: 600}
    TOTPEnrollmentConfirmRequest:
      type: object
      additionalProperties: false
      required: [enrollment_id, code]
      properties:
        enrollment_id:
          type: string
          pattern: '^mfe_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        code: {type: string, pattern: '^[0-9]{6}$'}
    TOTPReplacementRequest:
      type: object
      additionalProperties: false
      required: [recovery_code]
      properties:
        recovery_code:
          type: string
          minLength: 26
          maxLength: 30
          description: One 26-symbol Crockford Base32 recovery code, optionally in the documented hyphen grouping.
    TOTPAuthenticationCompleteRequest:
      type: object
      additionalProperties: false
      required: [pending_mfa_token, code]
      properties:
        pending_mfa_token:
          type: string
          minLength: 84
          maxLength: 84
          description: Opaque five-minute pending-MFA authority accepted only in this POST body.
        code: {type: string, pattern: '^[0-9]{6}$'}
    TOTPCredential:
      type: object
      additionalProperties: false
      required: [id, created_at, recovery_codes]
      properties:
        id:
          type: string
          pattern: '^mfc_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        created_at: {type: string, format: date-time}
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          writeOnly: true
          items: {$ref: '#/components/schemas/RecoveryCode'}
          description: Present exactly once after activation or replacement confirmation.
    TOTPState:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
        credential_id:
          type: string
          pattern: '^mfc_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    RecoveryCode:
      type: string
      minLength: 26
      maxLength: 30
      description: Exactly 26 random Crockford Base32 symbols (130 bits), optionally grouped with four expected hyphens.
    RecoveryCodeSet:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          writeOnly: true
          items: {$ref: '#/components/schemas/RecoveryCode'}
    RecoveryCodeState:
      type: object
      additionalProperties: false
      required: [available, remaining]
      properties:
        available: {type: boolean}
        remaining: {type: integer, minimum: 0, maximum: 10}
    RecoveryCodeCompleteRequest:
      type: object
      additionalProperties: false
      required: [pending_mfa_token, code]
      properties:
        pending_mfa_token:
          type: string
          minLength: 84
          maxLength: 84
        code: {$ref: '#/components/schemas/RecoveryCode'}
    PasskeyAttempt:
      type: object
      additionalProperties: false
      required: [attempt_id, public_key, expires_in]
      properties:
        attempt_id:
          type: string
          pattern: '^pka_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: One-time opaque BeeBox ceremony locator; it conveys no authority outside its stored scope.
        public_key:
          type: object
          additionalProperties: true
          description: Opaque browser WebAuthn creation or assertion options. BeeBox does not expose Go library types as public schema.
        expires_in:
          type: integer
          minimum: 1
          maximum: 300
    PasskeyRegistrationCompleteRequest:
      type: object
      additionalProperties: false
      required: [attempt_id, credential]
      properties:
        attempt_id:
          type: string
          pattern: '^pka_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        name:
          type: string
          maxLength: 64
          description: Optional bounded user-visible label; not authentication authority.
        credential:
          type: object
          additionalProperties: true
          description: Opaque browser WebAuthn registration response JSON consumed by BeeBox's maintained verifier.
    PasskeyAuthenticationCompleteRequest:
      type: object
      additionalProperties: false
      required: [attempt_id, credential]
      properties:
        attempt_id:
          type: string
          pattern: '^pka_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        credential:
          type: object
          additionalProperties: true
          description: Opaque browser WebAuthn assertion response JSON consumed by BeeBox's maintained verifier.
    Passkey:
      type: object
      additionalProperties: false
      required: [id, created_at]
      properties:
        id:
          type: string
          pattern: '^pky_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Opaque BeeBox-owned passkey resource locator.
        name:
          type: string
          maxLength: 64
        created_at: {type: string, format: date-time}
    PasskeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Passkey'}
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 43
          description: One-time opaque refresh credential. The server persists only verifier material.
    AuthenticationSession:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          pattern: '^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    AuthenticatedAuthenticationResult:
      type: object
      additionalProperties: false
      required: [status, session, access_token, token_type, expires_in, session_id]
      properties:
        status: {type: string, const: authenticated}
        session: {$ref: '#/components/schemas/AuthenticationSession'}
        access_token:
          type: string
          description: Ed25519/EdDSA JWT with required iss, sub, aud, sid, exp, nbf, iat and jti claims.
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, const: 300}
        session_id:
          type: string
          pattern: '^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        refresh_token:
          type: string
          description: Present only in non-browser mode. Browser mode uses the application-specific __Host- refresh cookie.
    MFARequiredAuthenticationResult:
      type: object
      additionalProperties: false
      required: [status, pending_mfa_token, expires_at, available_methods]
      properties:
        status: {type: string, const: mfa_required}
        pending_mfa_token:
          type: string
          minLength: 84
          maxLength: 84
          description: Opaque five-minute token; only a domain-separated SHA-256 verifier is persisted.
        expires_at: {type: string, format: date-time}
        available_methods:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [totp, recovery_code]
          description: Exact methods currently usable for this pending transaction.
    TokenResponse:
      oneOf:
        - {$ref: '#/components/schemas/AuthenticatedAuthenticationResult'}
        - {$ref: '#/components/schemas/MFARequiredAuthenticationResult'}
      discriminator:
        propertyName: status
        mapping:
          authenticated: '#/components/schemas/AuthenticatedAuthenticationResult'
          mfa_required: '#/components/schemas/MFARequiredAuthenticationResult'
    Session:
      type: object
      additionalProperties: false
      required: [id, user_id, created_at, expires_at, revoked]
      properties:
        id:
          type: string
          pattern: '^ses_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        user_id:
          type: string
          pattern: '^usr_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked: {type: boolean}
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, code, new_password]
      properties:
        email: {type: string, format: email}
        code:
          type: string
          pattern: '^[0-9]{8}$'
        new_password:
          type: string
          minLength: 15
          maxLength: 128
          description: Uses exactly the same NFC, length, safe-byte-bound and blocklist policy as signup.
    JWKS:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: '#/components/schemas/JWK'}
    JWK:
      type: object
      additionalProperties: false
      required: [kty, crv, use, alg, kid, x]
      properties:
        kty: {type: string, const: OKP}
        crv: {type: string, const: Ed25519}
        use: {type: string, const: sig}
        alg: {type: string, const: EdDSA}
        kid: {type: string}
        x: {type: string, description: Unpadded base64url Ed25519 public key material.}

  responses:
    Accepted:
      description: Request accepted without revealing protected account state.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StatusResponse'}
    OKStatus:
      description: Operation completed.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StatusResponse'}
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Application credential is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidCredentials:
      description: Credentials or one-time completion state are invalid without revealing identifier existence, verification, challenge, expiry, replay or ownership state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidRefresh:
      description: Refresh credential is invalid, expired, revoked or replayed. Replay revokes its owning session.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidSession:
      description: Access token or persisted current session state is invalid/revoked.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidPasskeyProof:
      description: Passkey ceremony or authenticator proof is invalid, expired, replayed or outside the trusted application/origin/RP/credential ownership scope without exposing verifier detail.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidTOTPProof:
      description: TOTP enrollment or pending-MFA proof is invalid, expired, exhausted, replayed, cross-application or already consumed without exposing protected state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TOTPForbidden:
      description: TOTP management returns origin_not_allowed for a disallowed Origin or reverification_required when accepted exact-session reverification evidence is missing or expired.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TOTPConflict:
      description: TOTP enrollment is rejected because one active logical credential already exists for the exact application/user.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidRecoveryProof:
      description: Recovery proof is invalid, expired, exhausted, replayed, cross-application or already consumed without exposing protected state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RecoveryForbidden:
      description: Recovery management requires the exact current application/user/session and accepted reverification evidence.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PasskeyForbidden:
      description: Passkey management returns origin_not_allowed for disallowed Origin or reverification_required when the exact persisted current session is outside the accepted recent-authentication window.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    SocialLinkUnauthorized:
      description: Social-link initiation returns invalid_application for an invalid application credential or invalid_session for an invalid, revoked, expired, cross-application, or otherwise non-current BeeBox session.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    SocialLinkForbidden:
      description: Social-link initiation returns origin_not_allowed for a disallowed Origin or reverification_required when the persisted initiating session is outside the accepted ten-minute recent-authentication window.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    SocialAccountForbidden:
      description: Social-account management returns origin_not_allowed for a disallowed Origin or reverification_required when unlink uses a persisted session outside the accepted ten-minute recent-authentication window. Listing does not require recent authentication.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    LastAuthenticationMethod:
      description: Unlink or passkey removal is rejected with code last_authentication_method because at least one currently usable authentication method must remain; detailed method inventory is intentionally not exposed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    SessionNotFound:
      description: Session is absent from the authenticated application scope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    VerificationFailed:
      description: Email verification cannot be completed without exposing protected identifier state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PasswordResetFailed:
      description: Password reset cannot be completed. Challenge/account/replay/expiry details are intentionally collapsed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Origin is not allowed for the resolved application.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Idempotency key conflicts with a different canonical request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidInput:
      description: Input fails deterministic validation, exact redirect policy, provider availability, or public password policy.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Public authentication request limit reached.
      headers:
        Retry-After: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: A required dependency is temporarily unavailable without provider/database details.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
